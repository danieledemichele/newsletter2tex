name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test della conversione
        run: python -m unittest discover -s tests -v

  pdf:
    name: Compilazione del PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Installa LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra \
            texlive-science texlive-lang-italian texlive-fonts-recommended cm-super
      - name: Converte e compila il numero di esempio
        run: python3 tests/compila_pdf.py
